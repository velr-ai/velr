[package]
name = "velr-cli"
# The CLI release version follows the git release tag. Release automation can
# pin the public Rust driver to the same version or an explicit override.
version = "0.2.50"
edition = "2021"
description = "Command-line interface for Velr"
license-file = "LICENSE"
readme = "README.md"
homepage = "https://velr.ai"
repository = "https://github.com/velr-ai/velr"
default-run = "velr"

[features]
default = []
fulltext-tantivy = []
vector-usearch = []
arrow-ipc = []

[dependencies]
# Public main tracks the latest compatible 0.2.x Rust driver. Release tags are
# rewritten by CI to an exact =X.Y.Z driver pin for reproducible source builds.
velr = { version = "=0.2.50", registry = "crates-io" }
velr-storage = { path = "storage" }
velr-types = { version = "=0.1.0", registry = "crates-io" }
rusqlite = { version = "0.37.0", features = ["bundled"] }
tabled = "0.20.0"
reedline = "0.41.0"
flate2 = "1"
crc32fast = "1"
regex = "1"
glob = "0.3"
memchr = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
csv = "1"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[[bin]]
name = "velr"
path = "src/main.rs"

[[bin]]
name = "velr-admin"
path = "src/bin/velr-admin.rs"
