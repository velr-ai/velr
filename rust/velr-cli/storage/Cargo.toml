[package]
name = "velr-storage"
version = "0.1.0"
edition = "2021"
publish = false
description = "Shared Velr storage schema and fresh-database initialization"

[features]
experimental-mapped-slots = ["dep:sha2"]
experimental-compact-default = ["experimental-mapped-slots", "dep:tempfile"]

[dependencies]
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde_json = "1"
sha2 = { version = "0.10", optional = true }
tempfile = { version = "3.23", optional = true }
